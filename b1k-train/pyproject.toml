[project]
name = "b1k-solution"
version = "0.1.0"
description = "BEHAVIOR-1K solution based on OpenPI"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "openpi",
    "jax[cuda12]>=0.4.35",
    "jaxlib>=0.4.35",
    "flax>=0.10.2",
    "numpy>=1.26.4",
    "torch>=2.5.1",
    "tyro>=0.9.12",
    "pydantic>=2.10.3",
    "opencv-python>=4.10.0",
    "joblib>=1.4.2",
    "matplotlib>=3.10.0",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    "numpydantic>=1.7.0",
    "einops>=0.8.0",
    "etils>=1.10.0",
    "websockets>=14.1",
    "orbax-checkpoint>=0.10.3",
    "tqdm-loggable>=0.2",
    "lerobot[dataset]>=0.5.0",
    "wandb>=0.18.0",
    "gpustat>=1.1.1",
    "huggingface-hub[cli]>=0.20.0",
    "chex>=0.1.89",  # imported by openpi/models/utils/fsq_tokenizer.py but not declared by openpi
    "pytest>=8.3.4",  # openpi/models_pytorch/gemma_pytorch.py imports pytest at module level
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "pre-commit>=4.0.1",
]

[tool.uv]
# Mirrors openpi/pyproject.toml overrides (not inherited from path deps).
override-dependencies = [
    "ml-dtypes==0.4.1",
    "tensorstore==0.1.74",
    # lerobot 0.5.x wants huggingface-hub>=1.0 but openpi@01177e0's transformers==4.53.2 needs <1.0.
    # Force the <1.0 line, matching the combination already running in b1k-evaluation's openpi venv
    # (huggingface-hub 0.36.2 + lerobot 0.5.2 + transformers 4.53.2).
    "huggingface-hub>=0.34.2,<1.0",
    # torchcodec must match torch: 0.4.x <-> torch 2.7 (the resolver otherwise picks 0.11 for torch 2.11).
    "torchcodec==0.4.0",
]

[tool.uv.sources]
openpi = { path = "openpi", editable = true }
openpi-client = { path = "openpi/packages/openpi-client", editable = true }
# LeRobot v3.0 dataset support for behavior-1k/2026-challenge-demos.
# (openpi@01177e0 pins lerobot 0.3.4 / v2.1 format, which cannot read the 2026 data.)
lerobot = { git = "https://github.com/wensi-ai/lerobot", branch = "release/b1k" }

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["b1k*"]

[tool.setuptools.package-data]
b1k = ["py.typed"]

